name: Update live stream IDs

on:
  schedule:
    # Daily at 00:30 UTC (06:00 IST)
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-ids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch current live video IDs
        env:
          # Optional but recommended: without it the script falls back to page
          # scraping, which YouTube often blocks from GitHub's runners.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update_live_ids.py index.html

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Live IDs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update live stream IDs ($(date -u +%Y-%m-%d))"
          git push
