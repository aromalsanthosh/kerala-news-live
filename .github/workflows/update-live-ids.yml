name: Update live stream IDs

on:
  schedule:
    # Three times a day: 05:47, 13:47 and 21:47 IST (00:17, 08:17, 16:17 UTC).
    # Off the top of the hour, when GitHub's scheduler is least congested.
    # Each run uses ~1 Actions minute and ~1,200 of the 10,000 daily
    # YouTube API quota units (12 channels).
    - cron: "17 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-ids
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch current live video IDs
        env:
          # Optional but recommended: without it the script falls back to page
          # scraping, which YouTube often blocks from GitHub's runners.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update_live_ids.py index.html

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Live IDs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update live stream IDs ($(date -u +%Y-%m-%d))"
          git push
