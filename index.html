<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;background:#000;color:#eee;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
  .grid{
    display:grid;
    gap:2px;
    padding:2px;
    /* Mobile: always 1 column, hidden tiles simply removed from flow */
    grid-template-columns:1fr;
    grid-auto-rows:auto;
  }
  .tile.hidden{ display:none; }
  .empty-state{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#666;font-size:14px;pointer-events:none;
  }
  .tile{
    position:relative;
    background:#111;
    overflow:hidden;
    aspect-ratio:16/9;
    min-height:0;
    min-width:0;
    border:2px solid transparent;
    transition:border-color 0.2s;
  }
  .tile.active-audio{
    border-color:#22c55e;
    box-shadow:0 0 0 2px #22c55e inset, 0 0 24px rgba(34,197,94,.35);
  }
  /* Tablet/desktop: fit grid exactly to viewport, no scroll */
  @media (min-width:700px){
    html,body{height:100%;overflow:hidden;overscroll-behavior:none}
    .grid{
      gap:4px;padding:4px;
      width:100vw;
      height:100vh;height:100svh;height:100dvh;
      grid-template-columns:repeat(var(--cols,3),1fr);
      grid-template-rows:repeat(var(--rows,3),1fr);
      grid-auto-rows:1fr;
    }
    .tile{aspect-ratio:auto}
  }
  .tile iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  /* === Audio panel === */
  :root{
    --panel-bg:rgba(15,16,22,.84);
    --panel-border:rgba(255,255,255,.09);
    --row-bg:rgba(255,255,255,.035);
    --row-hover:rgba(255,255,255,.07);
    --text:#eceef3;
    --muted:#8b91a1;
    --faint:#5d6272;
    --accent:#22c55e;
    --accent-soft:rgba(34,197,94,.14);
    --accent-line:rgba(34,197,94,.45);
  }
  .icon{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  #audioPanel{
    position:fixed;top:12px;right:12px;z-index:1000;
    display:flex;flex-direction:column;
    width:48px;max-height:48px;padding:6px;
    color:var(--text);
    background:var(--panel-bg);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--panel-border);
    border-radius:24px;
    box-shadow:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    font-size:13px;line-height:1.35;
    transition:width .25s ease,max-height .25s ease,padding .25s ease,border-radius .25s ease;
  }
  #audioPanel.expanded{
    width:min(300px,calc(100vw - 24px));
    max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);
    padding:8px;
    border-radius:16px;
  }

  /* Header (also the drag handle) */
  .panel-header{
    display:flex;align-items:center;gap:8px;
    padding:2px 2px 2px 4px;border-radius:12px;
    cursor:grab;white-space:nowrap;flex-shrink:0;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #audioPanel:not(.expanded) .panel-header{padding:0}
  #audioPanel.dragging,#audioPanel.dragging *{cursor:grabbing !important}
  body.panel-pointer-down iframe{pointer-events:none}
  .panel-grip{color:var(--faint);display:none}
  .panel-grip .icon{width:14px;height:14px;fill:currentColor;stroke:none}
  .panel-heading{display:none;flex:1;min-width:0;flex-direction:column;gap:1px}
  #audioPanel.expanded .panel-grip{display:flex}
  #audioPanel.expanded .panel-heading{display:flex}
  .panel-title{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .panel-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
  .panel-status b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .panel-controls{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .icon-btn{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;padding:0;border:0;border-radius:10px;
    background:transparent;color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s,transform .15s;
  }
  .icon-btn:hover{background:var(--row-hover);color:var(--text)}
  .icon-btn:focus-visible,.ch:focus-visible,.panel-btn:focus-visible,.bmc-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .panel-minimize{display:none}
  #audioPanel.expanded .panel-minimize{display:flex}
  .panel-speaker{
    width:36px;height:36px;border-radius:18px;
    background:rgba(255,255,255,.08);color:var(--text);
  }
  .panel-speaker:hover{background:rgba(255,255,255,.14);transform:scale(1.04)}
  #audioPanel.expanded .panel-speaker{display:none}
  #audioPanel.playing .panel-speaker{background:var(--accent);color:#04140a;box-shadow:0 0 0 4px rgba(34,197,94,.25)}

  /* Animated "now playing" bars */
  .eq{display:inline-flex;align-items:flex-end;gap:2px;width:14px;height:12px;flex-shrink:0}
  .eq i{flex:1;background:currentColor;border-radius:1px;animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:-.35s}
  .eq i:nth-child(3){animation-delay:-.7s}
  @keyframes eq{0%,100%{height:30%}50%{height:100%}}
  @media (prefers-reduced-motion:reduce){.eq i{animation:none;height:70%}}
  .panel-status .eq{color:var(--accent);width:12px;height:10px}

  /* Body */
  #audioButtons{display:none;flex-direction:column;gap:8px;margin-top:8px;min-height:0;flex:1}
  #audioPanel.expanded #audioButtons{display:flex}

  .panel-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;height:36px;padding:0 12px;border-radius:10px;
    font:inherit;font-size:12.5px;font-weight:600;
    color:var(--text);background:var(--row-bg);border:1px solid var(--panel-border);
    cursor:pointer;transition:background .15s,border-color .15s,color .15s;
  }
  .panel-btn:hover{background:var(--row-hover);border-color:rgba(255,255,255,.16)}
  .mute-all-btn.is-muted{color:var(--muted)}
  .mute-all-btn:not(.is-muted){color:#fecaca;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35)}
  .mute-all-btn:not(.is-muted):hover{background:rgba(239,68,68,.2)}

  .section-label{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:2px 4px 0;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  }
  .section-label span:last-child{letter-spacing:0;text-transform:none;font-weight:500}

  .channel-list{
    display:flex;flex-direction:column;gap:1px;
    overflow-y:auto;min-height:0;flex:1;margin:0 -4px;padding:0 4px;
    scrollbar-width:thin;scrollbar-color:#3a3e4a transparent;
  }
  .channel-list::-webkit-scrollbar{width:6px}
  .channel-list::-webkit-scrollbar-thumb{background:#3a3e4a;border-radius:3px}

  .ch{
    display:flex;align-items:center;gap:10px;
    min-height:34px;padding:0 3px 0 10px;border-radius:9px;
    border:1px solid transparent;cursor:pointer;
    transition:background .15s,border-color .15s,opacity .15s;
  }
  .ch:hover{background:var(--row-hover)}
  .ch .status{display:flex;align-items:center;justify-content:center;width:16px;color:var(--faint)}
  .ch .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .ch .key{
    min-width:19px;height:19px;padding:0 5px;border-radius:5px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-bottom-width:2px;
  }
  .ch .key:empty{visibility:hidden}
  .vis-toggle{width:28px;height:28px;border-radius:7px}
  .ch.active{background:var(--accent-soft);border-color:var(--accent-line)}
  .ch.active .status{color:var(--accent)}
  .ch.active .label{color:#fff}
  .ch.active .key{color:var(--accent);border-color:var(--accent-line);background:rgba(34,197,94,.1)}
  .ch.is-hidden .label,.ch.is-hidden .status,.ch.is-hidden .key{opacity:.4}
  .ch.is-hidden .vis-toggle{color:var(--faint)}

  /* Footer */
  .panel-footer{display:flex;flex-direction:column;gap:8px;flex-shrink:0;padding-top:8px;border-top:1px solid var(--panel-border)}
  .panel-actions{display:flex;gap:6px}
  .panel-actions .panel-btn{height:32px;font-size:12px;font-weight:500;color:var(--muted)}
  .panel-actions .panel-btn:hover{color:var(--text)}
  .bmc-link{
    display:flex;align-items:center;justify-content:center;gap:8px;height:36px;border-radius:10px;
    background:#ffdd00;color:#141414;font-size:12.5px;font-weight:700;text-decoration:none;
    transition:filter .15s,transform .15s;
  }
  .bmc-link:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .bmc-link .icon{stroke-width:2.2}
  .shortcuts{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:11px;color:var(--faint)}
  .shortcuts kbd{
    font:inherit;font-weight:600;color:var(--muted);
    padding:0 4px;border-radius:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  }
  @media (hover:none){.shortcuts{display:none}}
</style>
</head>
<body>
<div class="grid" id="grid"></div>

<!-- Collapsible Audio Control Panel -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.9 4.24A9 9 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M17.94 17.94A10 10 0 0 1 12 20c-6.5 0-10-8-10-8a18 18 0 0 1 5.06-5.94"/><path d="m2 2 20 20"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></symbol>
  <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2"/><path d="M10 2v2"/><path d="M14 2v2"/></symbol>
</svg>
<div id="audioPanel" class="expanded" role="region" aria-label="Audio controls">
  <div class="panel-header" id="panelHeader" title="Drag to move">
    <span class="panel-grip" aria-hidden="true"><svg class="icon"><use href="#i-grip"/></svg></span>
    <div class="panel-heading">
      <span class="panel-title">Audio</span>
      <span class="panel-status" id="panelStatus" aria-live="polite">All muted</span>
    </div>
    <div class="panel-controls">
      <button class="icon-btn panel-minimize" id="panelMinimize" title="Minimize (Esc)" aria-label="Minimize audio panel"><svg class="icon"><use href="#i-minus"/></svg></button>
      <button class="icon-btn panel-speaker" id="panelSpeaker" title="Open audio controls" aria-label="Open audio controls"><svg class="icon"><use href="#i-vol"/></svg></button>
    </div>
  </div>
  <div id="audioButtons"></div>
</div>

<script>
  // Edit this list to change channels/videos.
  // Use a YouTube video ID, or for a live channel use "live_stream?channel=CHANNEL_ID"
  // Set hidden: true to start a channel hidden (enable it from the audio panel)
  // channel: YouTube channel ID. If the video errors or its stream ends, the tile
  // falls back to the channel's current live stream (embed/live_stream?channel=...)
  const CHANNELS = [
    { id: "1wECsnGZcfc", channel: "UCup3etEdjyF1L3sRbU-rKLw", name: "24" },
    { id: "x1bfKawndzs", channel: "UCf8w5m0YsRa8MHQ5bwSGmbw", name: "Asianet News" },
    { id: "nObUcHKZEGY", channel: "UCFx1nseXKTc1Culiu3neeSQ", name: "Reporter" },
    { id: "Az5I714Nk4M", channel: "UClFe5TPbW1MVrOPpbNHTDoQ", name: "Big TV", hidden: true },
    { id: "tgBTspqA5nY", channel: "UCP0uG-mcMImgKnJz-VjJZmQ", name: "Manorama" },
    { id: "RbxEftGN584", channel: "UCwXrBBZnIh2ER4lal6WbAHw", name: "Mathrubhumi" },
    { id: "D6S9EZfT5N8", channel: "UCNVkxRPqsBNejO6B9thG9Xw", name: "Janam" },
    { id: "-8d8-c0yvyU", channel: "UC-f7r46JhYv78q5pGrO6ivA", name: "Media One" },
    { id: "yiiqRHY1Bl8", channel: "UCnEvxaWfVL91XIYuyQRO5QA", name: "Kairali" },
    { id: "K91rifR3BA0", channel: "UCXp6JTdq7-WwBK09S7SzmxQ", name: "News Malayalam" },
  ];
  const VIDEOS = CHANNELS.map(c => c.id);

  const grid = document.getElementById("grid");
  const audioButtonsContainer = document.getElementById("audioButtons");
  const audioPanel = document.getElementById("audioPanel");
  const panelHeader = document.getElementById("panelHeader");
  const panelSpeaker = document.getElementById("panelSpeaker");
  const panelMinimize = document.getElementById("panelMinimize");
  const panelStatus = document.getElementById("panelStatus");

  const players = [];
  const usingChannelFallback = new Set();

  function embedSrc(v, autoplay) {
    const params = `enablejsapi=1&autoplay=${autoplay}&mute=1&playsinline=1&rel=0&modestbranding=1`;
    return v.startsWith("live_stream")
      ? `https://www.youtube.com/embed/${v}&${params}`
      : `https://www.youtube.com/embed/${v}?${params}`;
  }
  let activeAudioIndex = -1;
  let isPanelExpanded = true;

  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  // Create tiles and audio buttons
  // Panel body: mute-all, channel list, footer
  const listLabel = document.createElement("div");
  listLabel.className = "section-label";
  listLabel.innerHTML = `<span>Channels</span><span id="visibleCount"></span>`;
  const channelList = document.createElement("div");
  channelList.className = "channel-list";
  audioButtonsContainer.append(listLabel, channelList);

  for (let i = 0; i < VIDEOS.length; i++) {
    const v = VIDEOS[i];
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.id = `tile-${i}`;
    const src = embedSrc(v, CHANNELS[i].hidden ? 0 : 1);
    const iframe = document.createElement("iframe");
    iframe.id = `player-${i}`;
    iframe.src = src;
    iframe.title = CHANNELS[i].name;
    iframe.loading = "lazy";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen = true;
    tile.appendChild(iframe);
    grid.appendChild(tile);

    const btn = document.createElement("div");
    btn.className = "ch audio-btn";
    btn.tabIndex = 0;
    btn.setAttribute("role", "button");
    btn.setAttribute("aria-pressed", "false");
    btn.innerHTML = `
      <span class="status"><svg class="icon"><use href="#i-mute"/></svg></span>
      <span class="label">${CHANNELS[i].name}</span>
      <span class="key" title="Keyboard shortcut">${i < 9 ? i + 1 : ""}</span>
      <button class="icon-btn vis-toggle" title="Hide this channel" aria-label="Hide ${CHANNELS[i].name}"><svg class="icon"><use href="#i-eye"/></svg></button>
    `;
    btn.dataset.index = i;
    const focusThis = () => {
      if (hidden.has(i)) toggleVisibility(i); // picking a hidden channel shows it
      setAudioFocus(activeAudioIndex === i ? -1 : i); // click again to mute
    };
    btn.addEventListener("click", (e) => {
      if (e.target.closest(".vis-toggle")) return;
      e.stopPropagation();
      focusThis();
    });
    btn.addEventListener("keydown", (e) => {
      if (e.target !== btn || (e.key !== "Enter" && e.key !== " ")) return;
      e.preventDefault();
      e.stopPropagation();
      focusThis();
    });
    btn.querySelector(".vis-toggle").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleVisibility(i);
    });
    channelList.appendChild(btn);
  }

  // Footer: Show/Hide all, Buy Me a Coffee, shortcut hint
  const footer = document.createElement("div");
  footer.className = "panel-footer";
  const actions = document.createElement("div");
  actions.className = "panel-actions";
  actions.innerHTML = `<button class="panel-btn" id="showAllBtn">Show all</button><button class="panel-btn" id="hideAllBtn">Hide all</button>`;
  actions.querySelector("#showAllBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    hidden.clear();
    applyVisibility();
  });
  actions.querySelector("#hideAllBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    for (let i = 0; i < VIDEOS.length; i++) hidden.add(i);
    applyVisibility();
  });

  const BMC_URL = "https://buymeacoffee.com/aromalsanthosh";
  const bmcLink = document.createElement("a");
  bmcLink.className = "bmc-link";
  bmcLink.href = BMC_URL;
  bmcLink.target = "_blank";
  bmcLink.rel = "noopener";
  bmcLink.title = "Support this site on Buy Me a Coffee";
  bmcLink.innerHTML = `<svg class="icon"><use href="#i-coffee"/></svg> Buy me a coffee`;
  bmcLink.addEventListener("click", (e) => e.stopPropagation());

  const hint = document.createElement("div");
  hint.className = "shortcuts";
  hint.innerHTML = `<span><kbd>1</kbd>–<kbd>9</kbd> listen</span><span><kbd>M</kbd> mute</span><span><kbd>Esc</kbd> minimize</span>`;

  footer.append(actions, bmcLink, hint);
  audioButtonsContainer.appendChild(footer);

  // Mute All button at top
  const muteAllBtn = document.createElement("button");
  muteAllBtn.className = "panel-btn mute-all-btn is-muted";
  muteAllBtn.innerHTML = `<svg class="icon"><use href="#i-mute"/></svg> <span>Mute all</span>`;
  muteAllBtn.title = "Mute all (M or 0)";
  muteAllBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setAudioFocus(-1);
  });
  audioButtonsContainer.insertBefore(muteAllBtn, audioButtonsContainer.firstChild);

  function expandPanel() {
    if (!isPanelExpanded) {
      isPanelExpanded = true;
      audioPanel.classList.add("expanded");
      panelHeader.title = "Drag to move";
    }
  }
  function collapsePanel() {
    if (isPanelExpanded) {
      isPanelExpanded = false;
      audioPanel.classList.remove("expanded");
      panelHeader.title = "Drag to move";
    }
  }
  function togglePanel() {
    if (isPanelExpanded) collapsePanel(); else expandPanel();
  }

  // === Draggable panel ===
  // Position is kept as right/top so expanding still grows leftwards.
  const PANEL_POS_KEY = "audioPanelPos";
  let drag = null;
  let suppressClick = false;

  function placePanel(right, top) {
    const rect = audioPanel.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    const vh = document.documentElement.clientHeight;
    right = Math.min(Math.max(0, right), Math.max(0, vw - rect.width));
    top = Math.min(Math.max(0, top), Math.max(0, vh - rect.height));
    audioPanel.style.right = `${right}px`;
    audioPanel.style.top = `${top}px`;
    return { right, top };
  }
  function clampPanel() {
    const rect = audioPanel.getBoundingClientRect();
    placePanel(document.documentElement.clientWidth - rect.right, rect.top);
  }

  panelHeader.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    const rect = audioPanel.getBoundingClientRect();
    drag = {
      x: e.clientX, y: e.clientY, moved: false,
      right: document.documentElement.clientWidth - rect.right, top: rect.top,
    };
    document.body.classList.add("panel-pointer-down");
  });
  window.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return; // small moves are clicks
    drag.moved = true;
    audioPanel.classList.add("dragging");
    placePanel(drag.right - dx, drag.top + dy);
  });
  function endDrag() {
    if (!drag) return;
    if (drag.moved) {
      audioPanel.classList.remove("dragging");
      // Swallow the click that follows a drag so it doesn't toggle the panel
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
      try {
        localStorage.setItem(PANEL_POS_KEY, JSON.stringify({
          right: parseFloat(audioPanel.style.right), top: parseFloat(audioPanel.style.top),
        }));
      } catch (_) {}
    }
    drag = null;
    document.body.classList.remove("panel-pointer-down");
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  audioPanel.addEventListener("click", (e) => {
    if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; }
  }, true);

  // Keep the panel on screen when it resizes or the window does
  audioPanel.addEventListener("transitionend", (e) => {
    if (e.target === audioPanel && (e.propertyName === "width" || e.propertyName === "max-height")) clampPanel();
  });
  window.addEventListener("resize", clampPanel);

  try {
    const saved = JSON.parse(localStorage.getItem(PANEL_POS_KEY));
    if (saved && Number.isFinite(saved.right) && Number.isFinite(saved.top)) placePanel(saved.right, saved.top);
  } catch (_) {}

  panelSpeaker.addEventListener("click", (e) => { e.stopPropagation(); expandPanel(); });
  panelMinimize.addEventListener("click", (e) => { e.stopPropagation(); collapsePanel(); });
  panelHeader.addEventListener("click", (e) => {
    if (!e.target.closest("button")) togglePanel();
  });

  // === Visibility / dynamic grid ===
  const hidden = new Set();
  CHANNELS.forEach((c, i) => { if (c.hidden) hidden.add(i); });

  function computeGridShape(n) {
    // Returns {cols, rows} for n visible tiles
    if (n <= 1) return { cols: 1, rows: 1 };
    if (n === 2) return { cols: 2, rows: 1 };
    if (n <= 4) return { cols: 2, rows: 2 };
    if (n <= 6) return { cols: 3, rows: 2 };
    if (n <= 9) return { cols: 3, rows: 3 };
    if (n <= 12) return { cols: 4, rows: 3 };
    const cols = Math.ceil(Math.sqrt(n));
    return { cols, rows: Math.ceil(n / cols) };
  }

  function applyVisibility() {
    const visibleCount = VIDEOS.length - hidden.size;
    document.querySelectorAll(".tile").forEach((tile, i) => {
      tile.classList.toggle("hidden", hidden.has(i));
    });
    document.querySelectorAll(".audio-btn").forEach((btn, i) => {
      btn.classList.toggle("is-hidden", hidden.has(i));
      const tog = btn.querySelector(".vis-toggle");
      if (tog) {
        const isHidden = hidden.has(i);
        tog.innerHTML = `<svg class="icon"><use href="#i-${isHidden ? "eye-off" : "eye"}"/></svg>`;
        tog.title = `${isHidden ? "Show" : "Hide"} this channel`;
        tog.setAttribute("aria-label", `${isHidden ? "Show" : "Hide"} ${CHANNELS[i].name}`);
      }
    });
    const countEl = document.getElementById("visibleCount");
    if (countEl) countEl.textContent = `${visibleCount} of ${VIDEOS.length} shown`;
    const { cols, rows } = computeGridShape(visibleCount);
    grid.style.setProperty("--cols", cols);
    grid.style.setProperty("--rows", rows);

    // If currently focused video got hidden, mute all
    if (activeAudioIndex !== -1 && hidden.has(activeAudioIndex)) {
      setAudioFocus(-1);
    }
    // Pause hidden players to save bandwidth, play visible ones
    players.forEach((player, i) => {
      if (!player?.playVideo) return;
      try {
        if (hidden.has(i)) player.pauseVideo();
        else player.playVideo();
      } catch (_) {}
    });
  }

  function toggleVisibility(i) {
    if (hidden.has(i)) hidden.delete(i); else hidden.add(i);
    applyVisibility();
  }

  function setAudioFocus(index) {
    activeAudioIndex = index;
    const EQ = `<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>`;
    document.querySelectorAll(".audio-btn").forEach((btn, i) => {
      const on = i === index;
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", String(on));
      btn.querySelector(".status").innerHTML = on ? EQ : `<svg class="icon"><use href="#i-mute"/></svg>`;
    });
    document.querySelectorAll(".tile").forEach((tile, i) => {
      tile.classList.toggle("active-audio", i === index);
    });
    if (index === -1) {
      panelStatus.textContent = "All muted";
    } else {
      panelStatus.innerHTML = `${EQ}<span>Playing</span> <b></b>`;
      panelStatus.querySelector("b").textContent = CHANNELS[index].name;
    }
    audioPanel.classList.toggle("playing", index !== -1);
    muteAllBtn.classList.toggle("is-muted", index === -1);
    panelSpeaker.title = index === -1 ? "Open audio controls" : `Playing ${CHANNELS[index].name} · open controls`;
    players.forEach((player, i) => {
      if (!player?.mute) return;
      if (i === index) { player.unMute(); player.setVolume(100); }
      else { player.mute(); }
    });
  }

  function attachPlayer(i) {
    new YT.Player(`player-${i}`, {
      events: {
        'onReady': (e) => {
          players[i] = e.target;
          if (i === activeAudioIndex) { e.target.unMute(); e.target.setVolume(100); }
          else e.target.mute();
          if (hidden.has(i)) e.target.pauseVideo();
        },
        // Video removed/unembeddable/recording unavailable
        'onError': () => switchToChannelLive(i),
        // A live stream that ends fires ENDED
        'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) switchToChannelLive(i); }
      }
    });
  }

  // Swap a tile to its channel's current live stream (once per tile)
  function switchToChannelLive(i) {
    const channel = CHANNELS[i].channel;
    if (!channel || usingChannelFallback.has(i)) return;
    usingChannelFallback.add(i);
    players[i] = undefined;
    const iframe = document.getElementById(`player-${i}`);
    iframe.src = embedSrc(`live_stream?channel=${channel}`, hidden.has(i) ? 0 : 1);
    attachPlayer(i);
  }

  window.onYouTubeIframeAPIReady = function() {
    for (let i = 0; i < VIDEOS.length; i++) attachPlayer(i);
  };

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    const key = e.key;
    if (/^[1-9]$/.test(key)) {
      const index = parseInt(key) - 1;
      if (index < VIDEOS.length && !hidden.has(index)) {
        e.preventDefault();
        setAudioFocus(index);
        if (!isPanelExpanded) expandPanel();
      }
    }
    if (key === "0" || key.toLowerCase() === "m") { e.preventDefault(); setAudioFocus(-1); }
    if (key === "Escape" && isPanelExpanded) collapsePanel();
  });

  // Apply default-hidden channels, then initialize muted
  applyVisibility();
  // On phones the panel would cover most of the screen: start minimized
  if (window.matchMedia("(max-width: 699px)").matches) collapsePanel();
  setTimeout(() => setAudioFocus(-1), 2000);
</script>
